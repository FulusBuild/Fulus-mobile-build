name: Build Fulus Release APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional API override (leave empty to use repository variable)"
        required: false
        type: string
        default: ""

env:
  FLUTTER_VERSION: "3.44.9"

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fulus Mobile
        uses: actions/checkout@v4
        with:
          repository: SanniMuhammed/Fulus-mobile
          ref: main
          token: ${{ secrets.FULUS_SOURCE_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap
          touch settings.gradle
          gradle wrapper --distribution-type all
          cp -v gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp -v gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
          APPLICATION_ID: ${{ vars.FULUS_APPLICATION_ID }}
        run: |
          test -n "$API_BASE_URL"
          test "$APPLICATION_ID" = "com.fulus.app"

          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "API_BASE_URL must use HTTPS"
              exit 1
              ;;
          esac

          case "$API_BASE_URL" in
            *".example"*)
              echo "Placeholder API_BASE_URL is not allowed"
              exit 1
              ;;
          esac

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FULUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/fulus-release.jks
          test -s android/app/fulus-release.jks

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.FULUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FULUS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FULUS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cat > android/key.properties <<EOF2
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fulus-release.jks
          EOF2

      - name: Build release APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify release artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
