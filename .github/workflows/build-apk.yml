name: Build Fulus APK

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fulus Mobile
        uses: actions/checkout@v4
        with:
          repository: SanniMuhammed/Fulus-mobile
          ref: main
          token: ${{ secrets.FULUS_SOURCE_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bootstrap Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap

          touch settings.gradle

          gradle wrapper --distribution-type all

          cp -v gradlew gradlew.bat \
            "$GITHUB_WORKSPACE/android/"

          cp -v gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/android/gradle/wrapper/"

          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fulus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
